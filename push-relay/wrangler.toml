name = "classmapper-push-relay"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Free tier is plenty: a few KV reads/writes per app-open, one cron sweep a
# minute that's a no-op unless something is actually due.
[triggers]
crons = ["* * * * *"]

# Created by `wrangler kv namespace create ALERTS` — see README.md. Replace
# the id below with the one that command prints out.
[[kv_namespaces]]
binding = "ALERTS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT are set as secrets
# (`wrangler secret put ...`), not here — see README.md. Never commit the
# private key to source control.
